name: dev-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Cheap or free model spec
        default: "openai:qwen3.8-flash"
      bug:
        default: "1"
      max_steps:
        default: "12"
      attempts:
        default: "1"
      token_budget:
        default: "150000"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_AGENT_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      JAVA_AGENT_TEMPERATURE: "0.1"
      JAVA_AGENT_MAX_TOKENS: "2048"
      JAVA_AGENT_HISTORY: "8"
      JAVA_AGENT_TOKEN_BUDGET: ${{ inputs.token_budget }}
    steps:
      - uses: actions/checkout@v4

      - name: Build sandbox image
        run: docker build -f docker/Dockerfile.d4j -t d4j-runner:2.0 .

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Run cheap model
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          uv run java-agent run \
            -p Lang \
            -b ${{ inputs.bug }} \
            --model "${{ inputs.model }}" \
            --attempts ${{ inputs.attempts }} \
            --max-steps ${{ inputs.max_steps }}

      - name: Check tool health
        if: always()
        run: uv run python scripts/trajectory_health.py "work/Lang-*/trajectory-*.jsonl"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-smoke
          path: |
            work/**/trajectory-*.jsonl
            work/**/report.md
            work/**/verify.log
            work/**/*.log
          if-no-files-found: warn
