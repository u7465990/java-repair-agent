[project]
name = "java-repair-agent"
version = "0.1.0"
description = "Autonomous Java bug-fixing agent: sandboxed tools, Defects4J evaluation, deterministic verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ricky Du" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "langgraph>=0.2.60",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
deepseek = ["langchain-deepseek>=0.1"]
agent = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-mcp-adapters>=0.1",
  "deepagents>=0.1",
  "langsmith>=0.2",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
]

[project.scripts]
java-agent = "java_agent.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/java_agent"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
